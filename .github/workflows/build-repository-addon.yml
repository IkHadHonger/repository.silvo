name: Build IkHadHonger repository addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cube-custom
        uses: actions/checkout@v4
        with:
          ref: cube-custom
          fetch-depth: 0

      - name: Build repository addon
        id: build
        shell: bash
        run: |
          python3 <<'EOF'
          from pathlib import Path
          import zipfile
          import xml.etree.ElementTree as ET
          import textwrap
          import os

          addon_id = "repository.ikhadhonger"
          addon_dir = Path(addon_id)
          addon_xml_path = addon_dir / "addon.xml"

          if not addon_xml_path.exists():
              raise FileNotFoundError(f"Missing {addon_xml_path}")

          # Validate and read the existing addon.xml.
          root = ET.parse(addon_xml_path).getroot()

          xml_addon_id = root.attrib.get("id")
          version = root.attrib.get("version")

          if xml_addon_id != addon_id:
              raise ValueError(
                  f"Unexpected addon id: {xml_addon_id}"
              )

          if not version:
              raise ValueError("No version found in addon.xml")

          required_assets = (
              addon_dir / "icon.png",
              addon_dir / "fanart.jpg",
          )

          for asset in required_assets:
              if not asset.exists():
                  raise FileNotFoundError(
                      f"Missing custom repository artwork: {asset}"
                  )

          # Remove old generated ZIPs.
          for path in addon_dir.glob(f"{addon_id}-*.zip"):
              path.unlink()

          zip_name = f"{addon_id}-{version}.zip"
          zip_path = addon_dir / zip_name

          # Build Kodi repository addon ZIP.
          with zipfile.ZipFile(
              zip_path,
              "w",
              zipfile.ZIP_DEFLATED
          ) as archive:
              for path in sorted(addon_dir.iterdir()):
                  if path == zip_path or path.name == "index.html":
                      continue

                  if path.is_file():
                      archive.write(
                          path,
                          Path(addon_id) / path.name
                      )

          # Generate browsable index.
          entries = [
              p.name
              for p in sorted(addon_dir.iterdir())
              if p.name != "index.html"
          ]

          links = "\n".join(
              f'<a href="{entry}">{entry}</a>'
              for entry in entries
          )

          index = f"""<!DOCTYPE html>
          <html>
          <head>
              <title>Index of /repository.ikhadhonger</title>
          </head>
          <body>
          <div style="display:none">
          {links}
          </div>
          </body>
          </html>
          """

          (addon_dir / "index.html").write_text(
              textwrap.dedent(index),
              encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"zip={zip_name}\n")

          print(f"Addon: {addon_id}")
          print(f"Version: {version}")
          print(f"Created: {zip_path}")
          EOF

      - name: Regenerate repository indexes
        run: |
          python3 _repo_generator.py

      - name: Commit generated repository addon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build IkHadHonger repository addon ${{ steps.build.outputs.version }}"
            git push origin cube-custom
          fi

      - name: Summary
        run: |
          echo "## Repository addon built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Addon: repository.ikhadhonger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: ${{ steps.build.outputs.zip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom icon.png included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom fanart.jpg included" >> "$GITHUB_STEP_SUMMARY"
