name: Build IkHadHonger repository addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cube-custom
        uses: actions/checkout@v4
        with:
          ref: cube-custom

      - name: Create repository addon
        shell: bash
        run: |
          python3 <<'EOF'
          from pathlib import Path
          import zipfile
          import xml.etree.ElementTree as ET
          import textwrap

          addon_id = "repository.ikhadhonger"
          version = "1.0.1"

          new_dir = Path(addon_id)
          new_dir.mkdir(exist_ok=True)

          # Keep our custom icon.png and fanart.jpg.
          # Only remove files that are generated by this workflow.
          for path in new_dir.glob(f"{addon_id}-*.zip"):
              path.unlink()

          for generated in ("addon.xml", "index.html"):
              path = new_dir / generated
              if path.exists():
                  path.unlink()

          # Make sure our custom artwork exists.
          required_assets = (
              new_dir / "icon.png",
              new_dir / "fanart.jpg",
          )

          for asset in required_assets:
              if not asset.exists():
                  raise FileNotFoundError(
                      f"Missing custom repository artwork: {asset}"
                  )

          addon_xml = """<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addon id="repository.ikhadhonger"
                 name="IkHadHonger Kodi Repository"
                 version="1.0.1"
                 provider-name="IkHadHonger">
              <extension point="xbmc.addon.repository"
                         name="IkHadHonger Kodi Repository">
                  <dir minversion="21.9.1">
                      <info compressed="false">https://raw.githubusercontent.com/IkHadHonger/repository.silvo/cube-custom/piers/addons.xml</info>
                      <checksum>https://raw.githubusercontent.com/IkHadHonger/repository.silvo/cube-custom/piers/addons.xml.md5</checksum>
                      <datadir zip="true">https://raw.githubusercontent.com/IkHadHonger/repository.silvo/cube-custom/piers/</datadir>
                  </dir>
              </extension>

              <extension point="xbmc.addon.metadata">
                  <summary lang="en_GB">IkHadHonger Kodi Repository</summary>
                  <description lang="en_GB">Kodi repository for custom Aeon Nox: SiLVO builds and related add-ons.</description>
                  <platform>all</platform>
                  <assets>
                      <icon>icon.png</icon>
                      <fanart>fanart.jpg</fanart>
                  </assets>
              </extension>
          </addon>
          """

          addon_xml = textwrap.dedent(addon_xml).strip() + "\n"

          (new_dir / "addon.xml").write_text(
              addon_xml,
              encoding="utf-8"
          )

          # Validate XML.
          ET.parse(new_dir / "addon.xml")

          zip_name = f"{addon_id}-{version}.zip"
          zip_path = new_dir / zip_name

          # Build repository addon ZIP.
          with zipfile.ZipFile(
              zip_path,
              "w",
              zipfile.ZIP_DEFLATED
          ) as archive:
              for path in sorted(new_dir.iterdir()):
                  if path == zip_path or path.name == "index.html":
                      continue

                  if path.is_file():
                      archive.write(
                          path,
                          Path(addon_id) / path.name
                      )

          # Generate browsable index.
          entries = [
              p.name
              for p in sorted(new_dir.iterdir())
              if p.name != "index.html"
          ]

          links = "\n".join(
              f'<a href="{entry}">{entry}</a>'
              for entry in entries
          )

          index = f"""<!DOCTYPE html>
          <html>
          <head>
              <title>Index of /repository.ikhadhonger</title>
          </head>
          <body>
          <div style="display:none">
          {links}
          </div>
          </body>
          </html>
          """

          (new_dir / "index.html").write_text(
              textwrap.dedent(index),
              encoding="utf-8"
          )

          print(f"Created {new_dir}")
          print(f"Created {zip_path}")
          print(f"Using custom artwork:")
          print(f"  {new_dir / 'icon.png'}")
          print(f"  {new_dir / 'fanart.jpg'}")
          EOF

      - name: Update repository generator
        shell: bash
        run: |
          python3 <<'EOF'
          from pathlib import Path

          path = Path("_repo_generator.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "if Path('repository.silvo').is_dir():\n"
              '            entries.append("repository.silvo/")',
              "if Path('repository.ikhadhonger').is_dir():\n"
              '            entries.append("repository.ikhadhonger/")'
          )

          text = text.replace(
              "# Also generate index for repository.silvo folder\n"
              "        repo_path = Path('repository.silvo')",
              "# Also generate index for repository.ikhadhonger folder\n"
              "        repo_path = Path('repository.ikhadhonger')"
          )

          path.write_text(text, encoding="utf-8")
          EOF

      - name: Regenerate repository indexes
        run: |
          python3 _repo_generator.py

      - name: Remove old SiLVO repository addon
        run: |
          rm -rf repository.silvo

      - name: Commit generated repository addon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build IkHadHonger repository addon 1.0.1"
            git push origin cube-custom
          fi

      - name: Summary
        run: |
          echo "## Repository addon built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Addon: repository.ikhadhonger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 1.0.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: repository.ikhadhonger-1.0.1.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom icon.png included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom fanart.jpg included" >> "$GITHUB_STEP_SUMMARY"
