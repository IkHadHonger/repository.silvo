name: Publish Tailscale 1.104.7 (Piers then AVDVPlus)

on:
  push:
    branches: [cube-custom]
    paths:
      - tools/build_tailscale.py
      - .github/workflows/publish-tailscale.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tailscale-cube-custom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing Kodi repository
        uses: actions/checkout@v4
        with:
          ref: cube-custom
          persist-credentials: true

      - name: Build and validate official ARM64 Tailscale 1.104.7 packages
        run: python3 tools/build_tailscale.py

      - name: Update Kodi channel metadata without deleting existing add-ons
        run: python3 _repo_generator.py piers avdvplus

      - name: Validate generated channel indices and ZIPs
        run: |
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path
          for channel in ("piers", "avdvplus"):
              index = Path(channel) / "addons.xml"
              blob = index.read_bytes()
              ET.fromstring(blob)
              checksum = hashlib.md5(blob).hexdigest()
              assert (Path(channel) / "addons.xml.md5").read_text().strip() == checksum
              assert b'id="service.tailscale"' in blob
              path = Path(channel) / "service.tailscale" / "service.tailscale-1.104.7.13.zip"
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  for binary in ("tailscale", "tailscaled"):
                      assert archive.read("service.tailscale/bin/" + binary).startswith(b"\x7fELF")
              print(f"Validated {channel}: index, checksum and ZIP")
          PY

      - name: Commit validated releases to Piers and AVDVPlus channels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piers avdvplus index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Already published"
          else
            git commit -m "Publish Tailscale 1.104.7 ARM64 addon for Kodi 22 and 21.3"
            git push origin HEAD:cube-custom
          fi
